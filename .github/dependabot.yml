version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ["*"]
