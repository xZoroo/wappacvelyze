name: Vulnerability database

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vulnerability-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run ./cmd/wappacvelyze-db -out dist/db
      - name: Publish as release assets under the rolling "db" tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view db >/dev/null 2>&1 || gh release create db \
            --title "Vulnerability database" \
            --notes "Daily prebuilt database consumed by the CLI and extension. Assets are overwritten by the scheduled workflow; see latest.json for the build time and sources."
          gh release upload db dist/db/latest.json dist/db/wappacvelyze-db.json.gz --clobber
