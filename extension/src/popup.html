<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WappaCVElyze</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">W</span>
        <span class="brand-name">Wappa<em>CVE</em>lyze</span>
      </div>
      <div class="header-actions">
        <button id="theme" type="button" class="icon-button" title="Theme">
          <svg class="icon icon-auto" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" />
          </svg>
          <svg class="icon icon-light" viewBox="0 0 20 20" aria-hidden="true" hidden>
            <circle cx="10" cy="10" r="3.6" fill="currentColor" />
            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path
                d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"
              />
            </g>
          </svg>
          <svg class="icon icon-dark" viewBox="0 0 20 20" aria-hidden="true" hidden>
            <path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1z" fill="currentColor" />
          </svg>
        </button>
        <button id="settings" type="button" class="icon-button" title="Settings">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M10 2.2l1.4 1.9 2.3-.5.9 2.2 2.2.9-.5 2.3 1.9 1.4-1.9 1.4.5 2.3-2.2.9-.9 2.2-2.3-.5L10 17.8l-1.4-1.9-2.3.5-.9-2.2-2.2-.9.5-2.3L1.8 10l1.9-1.4-.5-2.3 2.2-.9.9-2.2 2.3.5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>
    <div class="site">
      <span id="host" class="host"></span>
      <span id="state" class="state"></span>
    </div>
    <div id="summary" class="summary"></div>
    <main id="results" class="results"></main>
    <footer class="footer">
      <button id="rescan" type="button" class="button">Rescan page</button>
      <span class="footer-note">NVD · CISA KEV · EPSS · endoflife.date · Retire.js</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
